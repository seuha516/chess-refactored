<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="링크 하나로 친구와 두는 1대1 체스" />
    <meta name="theme-color" content="#101714" />
    <title>Chess</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body data-route="lobby" data-scene="pending">
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path
          d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.1 1.1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.1-1.1"
        />
      </symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4h11l-2.2 4L17 12H6" /></symbol>
      <symbol id="i-draw" viewBox="0 0 24 24"><path d="M6 9.5h12M6 14.5h12" /></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24">
        <path
          d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7"
        />
      </symbol>
      <symbol id="i-view" viewBox="0 0 24 24">
        <path
          d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12ZM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Z"
        />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M20 4 4 11l6.5 2.5L13 20l7-16ZM10.5 13.5 20 4" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4 20h4L19 9l-4-4L4 16v4Zm9.5-13.5 4 4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24">
        <path
          d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4ZM15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"
        />
      </symbol>
      <symbol id="i-mute" viewBox="0 0 24 24">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4ZM16 9.5l5 5M21 9.5l-5 5" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
    </svg>

    <header class="topbar">
      <a class="brand" href="/" id="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3.5v3.6M10.2 5.3h3.6M7.6 20h8.8M8.8 20l.9-3.2c-2.3-1.2-3.2-3.9-1.6-5.5 1.3-1.3 3.1-.8 3.9.6.8-1.4 2.6-1.9 3.9-.6 1.6 1.6.7 4.3-1.6 5.5l.9 3.2M9.7 16.8h4.6"
          />
        </svg>
        Chess
      </a>
      <div class="room-bar" id="room-bar" hidden>
        <button type="button" class="button ghost icon" id="back-to-lobby" aria-label="로비로">
          <svg class="icon" aria-hidden="true"><use href="#i-back" /></svg>
          <span class="label">로비</span>
        </button>
        <div class="plaque">
          <h1 class="room-title" id="room-title"></h1>
          <span class="room-meta" id="room-meta"></span>
        </div>
        <button type="button" class="button ghost" id="copy-link" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-link" id="copy-link-icon" /></svg>
          <span class="label" id="copy-link-label">초대 링크 복사</span>
        </button>
      </div>
      <div class="tools">
        <button
          type="button"
          class="button ghost icon"
          id="sound"
          aria-pressed="true"
          aria-label="효과음"
          title="효과음"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-sound" id="sound-icon" /></svg>
        </button>
        <button type="button" class="me" id="rename" title="이름 바꾸기" hidden>
          <span class="me-initial" id="my-initial" aria-hidden="true"></span>
          <span class="me-name" id="my-name"></span>
          <span class="visually-hidden">이름 바꾸기</span>
          <svg class="icon me-edit" aria-hidden="true"><use href="#i-edit" /></svg>
        </button>
      </div>
      <div
        class="leave-confirm"
        id="leave-confirm"
        role="alertdialog"
        aria-labelledby="leave-confirm-title"
        aria-describedby="leave-confirm-text"
        hidden
      >
        <p class="leave-confirm-title" id="leave-confirm-title">대국 중이에요. 나갈까요?</p>
        <p class="leave-confirm-text" id="leave-confirm-text">
          1분 안에 돌아오면 이어서 둘 수 있어요. 그 뒤에는 기권패예요.
        </p>
        <div class="confirm-actions">
          <button type="button" class="button danger" id="leave-yes">나가기</button>
          <button type="button" class="button" id="leave-no">계속 두기</button>
        </div>
      </div>
    </header>

    <p class="connection-banner" id="connection-banner" role="status" hidden></p>

    <main class="lobby" id="lobby-view" hidden>
      <div class="lobby-scene" id="lobby-scene" aria-hidden="true"></div>
      <div class="lobby-body">
        <section class="lobby-intro" aria-labelledby="lobby-title">
          <h1 id="lobby-title">대국실</h1>
          <p class="lead">방을 만들고 링크를 보내세요. 친구가 들어와 앉으면 바로 시작해요.</p>
          <form class="create-room" id="create-room">
            <label class="visually-hidden" for="room-name">방 이름 (비워 두어도 돼요)</label>
            <input
              id="room-name"
              type="text"
              maxlength="24"
              autocomplete="off"
              enterkeyhint="go"
              placeholder="방 이름"
            />
            <button type="submit" class="button primary">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
              방 만들기
            </button>
          </form>
          <p class="status" id="lobby-status" role="status"></p>
          <button type="button" class="resume" id="resume" hidden>
            <span class="resume-dot" aria-hidden="true"></span>
            <span class="resume-text">
              <span class="resume-title" id="resume-title"></span>
              <span class="resume-name" id="resume-name"></span>
            </span>
            <svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg>
          </button>
        </section>

        <section class="tables" aria-labelledby="tables-title">
          <div class="section-head">
            <h2 id="tables-title">열린 방</h2>
            <span class="count" id="room-count"></span>
          </div>
          <ul class="room-list" id="room-list" aria-labelledby="tables-title"></ul>
          <p class="lobby-empty" id="lobby-empty" hidden>
            지금은 열린 방이 없어요. 첫 방을 만들고 친구를 불러 보세요.
          </p>
        </section>
      </div>
    </main>

    <main class="room" id="room-view" hidden>
      <section class="stage" id="stage" aria-label="대국">
        <div class="seat" id="seat-top">
          <span class="puck" aria-hidden="true"></span>
          <span class="seat-who">
            <span class="seat-name"></span>
            <span class="seat-tag"></span>
          </span>
          <span class="seat-haul"></span>
          <span class="clock" role="timer" hidden></span>
        </div>

        <div class="scene" id="scene">
          <div class="table" id="table">
            <div class="rim-ranks" id="rim-ranks" aria-hidden="true"></div>
            <div class="board" id="board" role="grid" aria-label="체스판"></div>
            <div class="rim-files" id="rim-files" aria-hidden="true"></div>
          </div>
          <div class="invite" id="invite" hidden>
            <p class="invite-title" id="invite-title"></p>
            <p class="invite-text" id="invite-text"></p>
            <div class="invite-actions">
              <button type="button" class="button primary" id="invite-copy" hidden>
                <svg class="icon" aria-hidden="true">
                  <use href="#i-link" id="invite-copy-icon" />
                </svg>
                <span id="invite-copy-label">초대 링크 복사</span>
              </button>
              <span class="invite-seat" id="invite-seat"></span>
            </div>
          </div>
          <div class="result" id="result" hidden>
            <p class="result-title" id="result-title"></p>
            <p class="result-reason" id="result-reason"></p>
            <div class="result-actions">
              <span class="result-join" id="result-join"></span>
              <button type="button" class="button" id="result-close">닫기</button>
            </div>
          </div>
        </div>

        <div class="seat" id="seat-bottom">
          <span class="puck" aria-hidden="true"></span>
          <span class="seat-who">
            <span class="seat-name"></span>
            <span class="seat-tag"></span>
          </span>
          <span class="seat-haul"></span>
          <span class="clock" role="timer" hidden></span>
        </div>

        <!-- main.ts moves these into the seat they belong to, and back here when unused. -->
        <div class="stash" id="stash" hidden>
          <span class="captured" id="captured-white" aria-label="잡힌 백 기물"></span>
          <span class="captured" id="captured-black" aria-label="잡힌 흑 기물"></span>
          <button type="button" class="button primary" id="seat-take" hidden>자리에 앉기</button>
          <button type="button" class="button" id="seat-leave" hidden>앉기 취소</button>
        </div>
      </section>

      <section class="side" aria-label="대국 정보">
        <div class="referee">
          <div class="referee-text">
            <p class="status" id="status" role="status"></p>
            <p class="status-note" id="status-note" role="status" hidden></p>
            <p class="time-control" id="time-control" hidden></p>
          </div>
          <div class="controls" id="controls">
            <button type="button" class="button" id="draw-offer" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-draw" /></svg>
              <span id="draw-offer-label">무승부 제안</span>
            </button>
            <button type="button" class="button primary" id="draw-accept" hidden>
              무승부 수락
            </button>
            <button type="button" class="button" id="draw-decline" hidden>거절</button>
            <button type="button" class="button" id="resign" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-flag" /></svg>
              기권
            </button>
            <span class="view-tools" id="view-tools">
              <button
                type="button"
                class="button ghost"
                id="view"
                title="누를 때마다 시점이 바뀌어요. 판 바깥을 끌면 돌리고 기울이며, 휠로 가깝게, 두 번 누르면 처음 시점으로."
              >
                <svg class="icon" aria-hidden="true"><use href="#i-view" /></svg>
                <span id="view-label">기본 시점</span>
              </button>
              <button type="button" class="button ghost" id="flip">
                <svg class="icon" aria-hidden="true"><use href="#i-flip" /></svg>
                판 돌리기
              </button>
            </span>
          </div>
          <div class="confirm" id="confirm" hidden>
            <p class="confirm-text" id="confirm-text"></p>
            <div class="confirm-actions">
              <button type="button" class="button danger" id="confirm-yes"></button>
              <button type="button" class="button" id="confirm-no"></button>
            </div>
          </div>
        </div>

        <section class="sheet" aria-labelledby="moves-title">
          <div class="section-head">
            <h2 id="moves-title">기보</h2>
            <span class="count" id="move-count"></span>
          </div>
          <ol class="moves" id="moves" aria-labelledby="moves-title"></ol>
          <p class="moves-empty" id="moves-empty">아직 둔 수가 없어요.</p>
        </section>

        <section class="chat" aria-labelledby="chat-title">
          <div class="section-head">
            <h2 id="chat-title">채팅</h2>
            <span class="count" id="online"></span>
          </div>
          <ul class="chat-log" id="chat-log" aria-live="polite"></ul>
          <form class="chat-form" id="chat-form">
            <label class="visually-hidden" for="chat-input">메시지</label>
            <input
              id="chat-input"
              type="text"
              maxlength="200"
              autocomplete="off"
              placeholder="메시지 보내기"
            />
            <button type="submit" class="button icon" aria-label="전송" title="전송">
              <svg class="icon" aria-hidden="true"><use href="#i-send" /></svg>
            </button>
          </form>
        </section>
      </section>
    </main>

    <dialog
      id="name-dialog"
      aria-labelledby="name-dialog-title"
      aria-describedby="name-dialog-hint"
    >
      <form method="dialog" id="name-form">
        <h2 id="name-dialog-title">어떤 이름으로 둘까요?</h2>
        <label class="visually-hidden" for="name-input">이름</label>
        <input
          id="name-input"
          type="text"
          maxlength="16"
          autocomplete="nickname"
          enterkeyhint="done"
          required
        />
        <p class="hint" id="name-dialog-hint">상대와 관전자에게 보이는 이름이에요. 16자까지.</p>
        <div class="dialog-actions">
          <!-- type=button, so Enter in the field submits with the OK button, not this one. -->
          <button type="button" class="button ghost" id="name-cancel">취소</button>
          <button type="submit" value="ok" class="button primary" id="name-ok">확인</button>
        </div>
      </form>
    </dialog>

    <dialog id="promotion-dialog" aria-labelledby="promotion-dialog-title">
      <form method="dialog">
        <h2 id="promotion-dialog-title">무엇으로 승진할까요?</h2>
        <div class="promotion-choices" id="promotion-choices"></div>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="button ghost">취소</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
